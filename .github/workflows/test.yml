name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test
        shell: bash
        # The race detector needs cgo, which the Windows runner lacks.
        run: go test $([ "$RUNNER_OS" = Windows ] || echo -race) ./...

  # Installs pr-jump as a real login item, checks it answers, then removes it.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Let systemd user services run without a desktop session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Install, check it answers, uninstall
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/bin/" .
          export PATH="$RUNNER_TEMP/bin:$PATH"
          pr-jump install --owner beastawakens --port 7799
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:7799/?q=1') && [ "$status" = 302 ] && break
            sleep 1
          done
          echo "status: $status"
          [ "$status" = 302 ]
          pr-jump uninstall
          sleep 3
          ! curl -s -o /dev/null 'http://127.0.0.1:7799/?q=1'

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
